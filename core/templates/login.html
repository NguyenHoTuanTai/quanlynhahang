<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1934&auto=format&fit=crop");
    background-size: cover;
    background-position: center;
    height:100vh;
}

.login-box{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.logo{
    color:#e65c00;
    font-weight:bold;
    font-size:28px;
}

.btn-orange{
    background:#e65c00;
    color:white;
}

.btn-orange:hover{
    background:#cc5200;
    color:white;
}

</style>

</head>

<body>

<div class="container h-100">
<div class="row h-100 justify-content-center align-items-center">

<div class="col-md-4">

<div class="login-box">

<div class="text-center mb-4">
<a class="navbar-brand" href="/">
    <img src="/static/image/logo.png" height="170">
</a>
<h4 class="mt-2">Đăng nhập</h4>
</div>

<form method="post">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">Tên đăng nhập</label>
<input type="text" name="username" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Mật khẩu</label>
<input type="password" name="password" class="form-control">
</div>

<button class="btn btn-orange w-100">Đăng nhập</button>

</form>

<div class="text-center mt-3">

<a href="/" class="text-decoration-none">← Quay về trang chủ</a>

</div>

</div>

</div>

</div>
</div>

</body>
</html>
