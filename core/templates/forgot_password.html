<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Chỉnh hình nền cho toàn bộ trang web */
        body {
            /* Tạo một lớp phủ màu đen mờ (opacity 0.6) đè lên trên ảnh để chữ dễ đọc hơn */
            background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
            url("https://images.unsplash.com/photo-1514933651103-005eec06c04b");
            background-size: cover; /* Ảnh phủ kín toàn bộ màn hình */
            height: 100vh; /* Chiều cao bằng 100% màn hình hiển thị */
        }
        
        /* Khung màu trắng chứa form quên mật khẩu */
        .box {
            background: white;
            padding: 40px; /* Tạo khoảng cách từ viền vào nội dung bên trong */
            border-radius: 10px; /* Bo tròn các góc của khung */
        }
        
        /* Nút bấm màu cam đặc trưng của web */
        .btn-orange {
            background: #e65c00;
            color: white;
        }
    </style>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container h-100 d-flex justify-content-center align-items-center">
    
    <div class="col-md-4">

        <div class="box">
            <div class="text-center mb-4">
                <img src="/static/image/logo.png" height="120">
                <h4 class="mt-2">Quên mật khẩu</h4>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert 
                    {% if message.tags == 'error' %}alert-danger {% else %}alert-success {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
            
                <input type="text" name="username" class="form-control mb-3" placeholder="Tên đăng nhập" required>
            
                <input type="email" name="email" class="form-control mb-3" placeholder="Nhập email" required>
            
                <button class="btn btn-orange w-100">Tạo mật khẩu mới</button>
            </form>
            {% if new_password %}
            <div class="alert alert-success text-center mt-3">
                🔑 Mật khẩu mới: <strong>{{ new_password }}</strong>
            </div>
            {% endif %}

            <div class="text-center mt-3">
                <a href="/login">← Quay về đăng nhập</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
