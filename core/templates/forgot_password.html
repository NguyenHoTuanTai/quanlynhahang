<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quên mật khẩu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("https://images.unsplash.com/photo-1514933651103-005eec06c04b");
    background-size: cover;
    height:100vh;
}
.box{
    background:white;
    padding:40px;
    border-radius:10px;
}
.btn-orange{
    background:#e65c00;
    color:white;
}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="container h-100 d-flex justify-content-center align-items-center">
<div class="col-md-4">

<div class="box">
    <div class="text-center mb-4">
        <img src="/static/image/logo.png" height="120">
        <h4 class="mt-2">Quên mật khẩu</h4>
    </div>
{% if messages %}
    {% for message in messages %}
        <div class="alert 
        {% if message.tags == 'error' %}alert-danger
        {% else %}alert-success
        {% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="post">
{% csrf_token %}

<input type="email" name="email" class="form-control mb-3" placeholder="Nhập email" required>

<button class="btn btn-orange w-100">Gửi thông tin tài khoản</button>

</form>

<div class="text-center mt-3">
    <a href="/login">← Quay về đăng nhập</a>
</div>

</div>
</div>
</div>

</body>
</html>
