{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        #star-rating .star {
            transition: color 0.2s, transform 0.2s;
            color: #ccc;
        }
        #star-rating .star.hovered,
        #star-rating .star.selected {
            color: #ffc107;
            transform: scale(1.3);
        }
        .btn-orange { background-color: #e65c00; color: white; border: none; }
        .btn-orange:hover { background-color: #cc5200; color: white; }
        .btn-outline-orange { border: 1px solid #e65c00; color: #e65c00; }
        .btn-outline-orange:hover { background-color: #e65c00; color: white; }
        .border-orange { border-color: #e65c00 !important; }
        body { 
            background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
            url("https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1934&auto=format&fit=crop");
            background-size: cover;
            background-position: center;
            height:100vh;
        }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="tel"], input[type="date"], input[type="time"], input[type="number"], textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px;
        }
        </style>
{% include 'navbar_user.html' %}
</head>

<div class="container my-5" style="max-width: 600px; padding-bottom: 50px;">
    <div class="card shadow-sm rounded-4" >
        <div class="card-body">
            <h3 class="card-title text-center mb-4 fw-bold">Gửi đánh giá của bạn</h3>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success alert-dismissible fade show text-center" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}

                
                <div class="mb-3">
                    <label for="ten_khach_hang" class="form-label">Tên của bạn</label>
                    <input type="text" id="ten_khach_hang" name="ten_khach_hang" class="form-control" placeholder="Nhập tên của bạn" required>
                </div>

                
                <div class="mb-3">
                    <label for="mon_an" class="form-label">Chọn món</label>
                    <select id="mon_an" name="mon_an" class="form-select" required>
                        <option value="" disabled selected>-- Chọn món --</option>
                        {% for mon in mon_ans %}
                            <option value="{{ mon.id }}">{{ mon.ten_mon }}</option>
                        {% endfor %}
                    </select>
                </div>

                
                <div class="mb-3">
                    <label class="form-label">Đánh giá</label>
                    <div id="star-rating" class="d-flex gap-2" style="font-size: 2rem; cursor:pointer;">
                        <span class="star">☆</span>
                        <span class="star">☆</span>
                        <span class="star">☆</span>
                        <span class="star">☆</span>
                        <span class="star">☆</span>
                    </div>
                    <input type="hidden" name="diem_danh_gia" id="diem_danh_gia">
                </div>

                
                <div class="mb-3">
                    <label for="noi_dung" class="form-label">Nội dung đánh giá</label>
                    <textarea id="noi_dung" name="noi_dung" rows="4" class="form-control" placeholder="Viết đánh giá của bạn..." required></textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-orange btn-lg px-4 me-3">Gửi đánh giá</button>
                </div>
            </form>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>    
const form = document.querySelector("form");
const stars = document.querySelectorAll("#star-rating .star");
const hiddenInput = document.getElementById("diem_danh_gia");


stars.forEach((star, idx) => {
    star.dataset.value = idx + 1;

    star.addEventListener("mouseover", () => {
        const val = star.dataset.value;
        stars.forEach(s => s.classList.toggle('hovered', s.dataset.value <= val));
    });

    star.addEventListener("mouseout", () => {
        const val = hiddenInput.value || 0;
        stars.forEach(s => {
            s.classList.remove('hovered');
            s.classList.toggle('selected', s.dataset.value <= val);
        });
    });

    star.addEventListener("click", () => {
        hiddenInput.value = star.dataset.value;
        stars.forEach(s => s.classList.toggle('selected', s.dataset.value <= star.dataset.value));
    });
});


form.addEventListener("submit", (e) => {
    if (!hiddenInput.value) {
        e.preventDefault(); 
        alert("Vui lòng chọn ít nhất 1 sao trước khi gửi đánh giá!");
        return false;
    }
});

setTimeout(() => {
    const alert = document.querySelector(".alert");
    if (alert) alert.remove();
}, 3000);

</script>
