<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1934&auto=format&fit=crop");
    background-size: cover;
    background-position: center;
    height:100vh;
}
.register-box{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}
.btn-orange{
    background:#e65c00;
    color:white;
}
.btn-orange:hover{
    background:#cc5200;
}
</style>
</head>

<body>
<div class="container h-100">
<div class="row h-100 justify-content-center align-items-center">
<div class="col-md-4">

<div class="register-box">
<div class="text-center mb-4">
    <img src="/static/image/logo.png" height="120">
    <h4 class="mt-2">Đăng ký</h4>
</div>

<!-- Messages -->
{% if messages %}
    {% for message in messages %}
        <div class="alert 
            {% if message.tags == 'error' %}alert-danger
            {% elif message.tags == 'success' %}alert-success
            {% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="post">
{% csrf_token %}

<div class="mb-3">
    <label>Tên đăng nhập</label>
    <input type="text" name="username" class="form-control" required>
</div>

<div class="mb-3">
    <label>Email</label>
    <input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
    <label>Mật khẩu</label>
    <input type="password" id="password" name="password1" class="form-control" required>
    <div id="password-errors" class="mt-2"></div>
</div>

<div class="mb-3">
    <label>Nhập lại mật khẩu</label>
    <input type="password" name="password2" class="form-control" required>
</div>

<button class="btn btn-orange w-100">Đăng ký</button>
</form>

<div class="text-center mt-3">
    <a href="/login">Đã có tài khoản? Đăng nhập</a>
</div>

</div>

</div>
</div>
</div>

<div class="modal fade" id="otpModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="text-center mb-3">Nhập mã OTP</h5>

      <form method="post">
        {% csrf_token %}
        <input type="text" name="otp" class="form-control mb-3" placeholder="Nhập OTP">
        <button class="btn btn-success w-100">Xác nhận</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
var showOtp = "{{ show_otp_modal|yesno:'true,false' }}" === "true";

if (showOtp) {
    setTimeout(() => {
        var myModal = new bootstrap.Modal(document.getElementById('otpModal'));
        myModal.show();
    }, 300);
}
</script>

<script>
const passwordInput = document.getElementById("password");
const errorBox = document.getElementById("password-errors");

passwordInput.addEventListener("input", function () {
    const password = passwordInput.value;
    let errors = [];

    if (password.length < 8) {
        errors.push("Ít nhất 8 ký tự");
    }

    if (/^\d+$/.test(password)) {
        errors.push("Không được toàn số");
    }

    const commonPasswords = ["123456", "password", "12345678", "qwerty"];
    if (commonPasswords.includes(password.toLowerCase())) {
        errors.push("Mật khẩu quá phổ biến");
    }

    const username = document.querySelector('input[name="username"]').value;
    if (username && password.toLowerCase().includes(username.toLowerCase())) {
        errors.push("Không được giống tên đăng nhập");
    }

    if (errors.length > 0) {
        errorBox.innerHTML = errors.map(e => 
            `<div class="text-danger">❌ ${e}</div>`
        ).join("");
    } else if (password.length > 0) {
        errorBox.innerHTML = `<div class="text-success">Mật khẩu hợp lệ</div>`;
    } else {
        errorBox.innerHTML = "";
    }
});
</script>

</body>
</html>
