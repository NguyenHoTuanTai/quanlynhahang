{% load static %}

<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đánh giá</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body { 
    background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1934&auto=format&fit=crop");
    background-size: cover;
    background-position: center;
    min-height:100vh;
}

/* CARD */
.card {
    border-radius: 20px;
}

/* BUTTON */
.btn-orange { background-color: #e65c00; color: white; border: none; }
.btn-orange:hover { background-color: #cc5200; }

/* INPUT */
.form-control, .form-select {
    border-radius: 10px;
    padding: 10px;
}

/* STAR */
#star-rating .star {
    font-size: 1.8rem;
    color: #ccc;
    transition: 0.2s;
}

#star-rating .star.hovered,
#star-rating .star.selected {
    color: #ffc107;
    transform: scale(1.2);
}

/* MOBILE FIX */
@media (max-width: 576px){
    .container{
        padding-left: 10px;
        padding-right: 10px;
    }

    #star-rating .star {
        font-size: 1.5rem;
    }
}
</style>

</head>

<body>

{% include 'navbar_user.html' %}

<div class="container py-4 py-md-5">

```
<div class="mx-auto" style="max-width: 600px;">
    <div class="card shadow-lg p-3 p-md-4">

        <h4 class="text-center fw-bold mb-4">Gửi đánh giá của bạn</h4>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold">Tên của bạn</label>
                <input type="text" name="ten_khach_hang" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Chọn món</label>
                <select name="mon_an" class="form-select" required>
                    <option value="" disabled selected>-- Chọn món --</option>
                    {% for mon in mon_ans %}
                    <option value="{{ mon.id }}">{{ mon.ten_mon }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3 text-center">
                <label class="form-label fw-semibold">Đánh giá</label>
                <div id="star-rating" class="d-flex justify-content-center gap-2">
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                    <span class="star">☆</span>
                </div>
                <input type="hidden" name="diem_danh_gia" id="diem_danh_gia">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Nội dung</label>
                <textarea name="noi_dung" rows="4" class="form-control" required></textarea>

    </div>
</div>
```

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const form = document.querySelector("form");
const stars = document.querySelectorAll("#star-rating .star");
const hiddenInput = document.getElementById("diem_danh_gia");

stars.forEach((star, idx) => {
    star.dataset.value = idx + 1;

    star.addEventListener("mouseover", () => {
        stars.forEach(s => s.classList.toggle('hovered', s.dataset.value <= star.dataset.value));
    });

    star.addEventListener("mouseout", () => {
        stars.forEach(s => {
            s.classList.remove('hovered');
            s.classList.toggle('selected', s.dataset.value <= hiddenInput.value);
        });
    });

    star.addEventListener("click", () => {
        hiddenInput.value = star.dataset.value;
        stars.forEach(s => s.classList.toggle('selected', s.dataset.value <= star.dataset.value));
    });
});

form.addEventListener("submit", (e) => {
    if (!hiddenInput.value) {
        e.preventDefault();
        alert("Vui lòng chọn ít nhất 1 sao!");
    }
});
</script>

</body>
</html>
