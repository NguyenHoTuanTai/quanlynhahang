<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Đăng ký</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Chỉnh hình nền toàn trang */
        body {
            /* Phủ một lớp màu đen mờ (opacity 0.6) lên trên ảnh để chữ dễ đọc hơn */
            background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
            url("https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1934&auto=format&fit=crop");
            background-size: cover; /* Ảnh phủ kín màn hình */
            background-position: center; /* Căn ảnh ở giữa */
            height: 100vh; /* Chiều cao bằng 100% màn hình hiển thị */
        }
        
        /* Chỉnh khung form đăng ký màu trắng ở giữa */
        .register-box {
            background: white;
            padding: 40px;
            border-radius: 10px; /* Bo tròn góc */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); /* Tạo bóng đổ 3D cho đẹp */
        }
        
        /* Chỉnh màu cho nút bấm Đăng ký */
        .btn-orange {
            background: #e65c00; /* Màu cam */
            color: white;
        }
        
        /* Hiệu ứng khi rê chuột vào nút Đăng ký sẽ đổi màu cam sậm hơn */
        .btn-orange:hover {
            background: #cc5200;
        }
    </style>
</head>

<body>
<div class="container h-100">
    <div class="row h-100 justify-content-center align-items-center">
        
        <div class="col-md-4">

            <div class="register-box">
                <div class="text-center mb-4">
                    <img src="/static/image/logo.png" height="120">
                    <h4 class="mt-2">Đăng ký</h4>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert 
                            {% if message.tags == 'error' %}alert-danger {% elif message.tags == 'success' %}alert-success {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Tên đăng nhập</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Mật khẩu</label>
                        <input type="password" id="password" name="password1" class="form-control" required>
                        <div id="password-errors" class="mt-2"></div>
                    </div>

                    <div class="mb-3">
                        <label>Nhập lại mật khẩu</label>
                        <input type="password" name="password2" class="form-control" required>
                    </div>

                    <button class="btn btn-orange w-100">Đăng ký</button>
                </form>

                <div class="text-center mt-3">
                    <a href="/login">Đã có tài khoản? Đăng nhập</a>
                </div>

            </div>

        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>



<script>
// Lấy ô nhập mật khẩu và cái khung để in lỗi ra
const passwordInput = document.getElementById("password");
const errorBox = document.getElementById("password-errors");

// Bắt sự kiện 'input' (mỗi khi người dùng gõ thêm 1 chữ vào ô mật khẩu)
passwordInput.addEventListener("input", function () {
    const password = passwordInput.value;
    let errors = []; // Mảng chứa các lỗi

    // Kiểm tra 1: Mật khẩu phải từ 8 ký tự trở lên
    if (password.length < 8) {
        errors.push("Ít nhất 8 ký tự");
    }

    // Kiểm tra 2: Mật khẩu không được toàn là số (Dùng Regex ^\d+$)
    if (/^\d+$/.test(password)) {
        errors.push("Không được toàn số");
    }

    // Kiểm tra 3: Chống dùng mật khẩu quốc dân, quá dễ đoán
    const commonPasswords = ["123456", "password", "12345678", "qwerty"];
    if (commonPasswords.includes(password.toLowerCase())) {
        errors.push("Mật khẩu quá phổ biến");
    }

    // Kiểm tra 4: Mật khẩu không được chứa tên đăng nhập bên trong nó
    const username = document.querySelector('input[name="username"]').value;
    if (username && password.toLowerCase().includes(username.toLowerCase())) {
        errors.push("Không được giống tên đăng nhập");
    }

    // Cuối cùng: Kiểm tra xem có lỗi nào không
    if (errors.length > 0) {
        // Có lỗi -> In toàn bộ lỗi ra thành dòng chữ đỏ
        errorBox.innerHTML = errors.map(e => 
            `<div class="text-danger">❌ ${e}</div>`
        ).join("");
    } else if (password.length > 0) {
        // Gõ đủ điều kiện -> Báo xanh lá "Hợp lệ"
        errorBox.innerHTML = `<div class="text-success">Mật khẩu hợp lệ</div>`;
    } else {
        // Ô nhập bị xóa trống trơn -> Không báo gì
        errorBox.innerHTML = "";
    }
});
</script>

</body>
</html>
